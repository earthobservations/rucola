name: Release

on:
  release:
    types: [ published ]

env:
  PYTHON: "3.14"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Acquire sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v8.3.1
        with:
          enable-cache: false
          python-version: ${{ env.PYTHON }}

      - name: Install project
        run: uv sync

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish
